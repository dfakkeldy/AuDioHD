name: CI

on:
  push:
    branches: [ main, weekly, nightly ]
  pull_request:
    branches: [ main, weekly, nightly ]

# Cancel superseded runs on the same branch/PR to save runner minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Build gate + tests
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history so the change-scope classifier below can diff against
          # the pull request's merge base. A shallow clone has no merge base,
          # so every PR would look like it changed everything.
          fetch-depth: 0

      # Documentation-only pull requests cannot change anything the compiler or
      # the Swift test suite observes, so they skip the Xcode gate below and
      # finish in about a minute instead of ~53. The decision deliberately does
      # NOT live here as shell: a wrong "true" silently skips the whole build
      # gate and the PR still reports green. It lives in a unit-tested module
      # that also carries a tripwire for newly bundled Markdown
      # (Scripts/doc_contracts/changed_scope.py).
      #
      # Note this is a step-level skip inside a job that always runs. A
      # workflow-level `paths-ignore` would stop this workflow reporting the
      # "Build gate + tests" context at all, and because that context is a
      # required status check on main/weekly/nightly, the PR would then wait
      # forever for a check that never arrives.
      - name: Classify change scope
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            echo "Not a pull request — running the full gate."
            exit 0
          fi
          CHANGED="$(git diff --name-only "$BASE_SHA...$HEAD_SHA")"
          echo "Changed files:"
          echo "$CHANGED"
          # The module exits non-zero if the pbxproj tripwire trips, failing this
          # step rather than quietly downgrading to a skipped build.
          DOCS_ONLY="$(printf '%s\n' "$CHANGED" |
            PYTHONPATH=Scripts python3 -m doc_contracts.changed_scope --stdin)"
          echo "docs_only=$DOCS_ONLY" >> "$GITHUB_OUTPUT"
          if [ "$DOCS_ONLY" = "true" ]; then
            echo "::notice title=Documentation-only change::Skipping the Xcode build gate. Doc and help-text contracts still run."
          fi

      - name: Fastlane release tests (fast, no Xcode)
        run: make fastlane-test

      # Documentation and in-app help contracts. These assertions used to live in
      # the EchoTests Swift target, where they cost a full simulator build even
      # though they never import app code — they open files and match substrings.
      # Running them here catches a stale Settings path in under a second, on
      # every PR including documentation-only ones.
      - name: Doc & help-text contracts (fast, no Xcode)
        run: make doc-contract-test

      # Fast, no-Xcode signal: a pure-stdlib Python unittest suite over
      # Scripts/echo_renderer/ (versioned renderer install/verify/promote/repair).
      # Runs in seconds without a simulator or SDK, so failures here are caught
      # before the expensive Xcode build/test steps below even start.
      - name: Renderer installer tests (fast, no Xcode)
        run: make renderer-install-test

      - name: Synthetic narration benchmark fixture tests
        run: |
          python3 -m unittest discover -s Tools/Pronunciation/tests -p test_narration_benchmark.py -v
          python3 -m unittest discover -s Tools/Pronunciation/tests -p test_epub_pronunciation_fixture.py -v

      # The audio-judge suite measures real media with ffprobe and transcodes
      # a real MP3 with ffmpeg. Those are hard requirements in the suite's
      # setUp, not skip conditions: a silently skipped safety suite reports a
      # false pass, which is precisely what these gates exist to prevent. CI
      # therefore installs the toolchain rather than letting the suite opt out.
      # Cache the Homebrew download so a green run does not depend on
      # Homebrew's servers, and pin the formula so the media toolchain cannot
      # float to a new major between runs.
      - name: Cache Homebrew downloads (ffmpeg)
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/Homebrew/downloads
          key: ${{ runner.os }}-brew-ffmpeg@7
          restore-keys: |
            ${{ runner.os }}-brew-ffmpeg

      - name: Install ffmpeg/ffprobe for the audio-judge gate
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_UPGRADE: "1"
          HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: "1"
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1; then
            brew install ffmpeg@7
            brew link --overwrite --force ffmpeg@7
          fi
          # Record the exact toolchain in the run log; the suites measure real
          # media, so the version is part of the evidence.
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1

      # Pronunciation corpus contracts: fixture schema, named-regression
      # outcomes, human-label qualification state, and repository-scope
      # refusal. Pure stdlib Python, seconds to run.
      - name: Pronunciation corpus contract tests (fast, no Xcode)
        run: make pronunciation-corpus-test

      # Privacy projection, prospective cap arithmetic, hardlink and symlink
      # refusal, request/audio binding, and attempt-ledger tamper evidence.
      # Previously enforced only when a human typed the target locally.
      - name: Pronunciation audio-judge tests (fast, no Xcode)
        run: make pronunciation-audio-judge-test

      # Pin the toolchain to Xcode 26.x so CI compiles against the same SDK the
      # project is developed and shipped with. The macos-26 runner defaults to
      # Xcode 26.x today, and this explicit selection keeps future image updates
      # from silently jumping to a new major.
      - name: Select Xcode 26
        if: steps.scope.outputs.docs_only != 'true'
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26'

      - name: Install Metal toolchain
        if: steps.scope.outputs.docs_only != 'true'
        run: xcodebuild -downloadComponent MetalToolchain

      - name: Cache Swift Package Manager
        if: steps.scope.outputs.docs_only != 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            ~/Library/Developer/Xcode/DerivedData
          # Namespaced by toolchain: DerivedData and module caches are not portable
          # across Xcode major versions, so a cache saved by an earlier 16.4 run
          # must not be restored into a 26.x build.
          key: ${{ runner.os }}-xcode26-spm-${{ hashFiles('**/Package.resolved', 'Echo.xcodeproj/project.pbxproj') }}
          restore-keys: |
            ${{ runner.os }}-xcode26-spm-

      - name: Diagnostics
        if: steps.scope.outputs.docs_only != 'true'
        run: |
          xcodebuild -version
          echo "=== installed simulator runtimes ==="
          xcrun simctl list runtimes | grep -E "iOS|watchOS" || true
          echo "=== available devices ==="
          xcrun simctl list devices available | grep -E "iPhone|Watch" || true

      - name: Select iOS 26 test simulator
        if: steps.scope.outputs.docs_only != 'true'
        id: ios-sim
        run: |
          set -euo pipefail
          IOS_SIM_SELECTION="$(
            xcrun simctl list devices available --json |
              jq -r '
                .devices
                | to_entries
                | map(
                    select(.key | test("SimRuntime\\.iOS-26-"))
                    | . + {
                        version: (
                          .key
                          | capture("iOS-(?<major>[0-9]+)-(?<minor>[0-9]+)")
                          | [.major, .minor]
                          | map(tonumber)
                        )
                      }
                  )
                | sort_by(.version[0], .version[1])
                | reverse
                | [
                    .[]
                    | .value
                    | map(
                        select(.isAvailable == true and (.name | test("^iPhone")))
                        | . + {
                            preference: (
                              if .name == "iPhone 17 Pro Max" then 0
                              elif .name == "iPhone 17 Pro" then 1
                              elif .name == "iPhone 17" then 2
                              elif .name == "iPhone Air" then 3
                              else 4
                              end
                            )
                          }
                      )
                    | sort_by(.preference)[]
                  ]
                | first
                | if . then [.udid, .name] | @tsv else empty end
              ' |
              head -n 1
          )"
          IOS_SIM_UDID="${IOS_SIM_SELECTION%%$'\t'*}"
          IOS_SIM_NAME="${IOS_SIM_SELECTION#*$'\t'}"

          if [ -z "$IOS_SIM_UDID" ] || [ "$IOS_SIM_UDID" = "$IOS_SIM_NAME" ]; then
            echo "::error title=iOS 26 iPhone simulator missing::The CI runner does not expose a compatible iOS 26 iPhone simulator."
            xcrun simctl list runtimes
            xcrun simctl list devices available
            exit 1
          fi

          echo "destination=platform=iOS Simulator,id=$IOS_SIM_UDID" >> "$GITHUB_OUTPUT"
          echo "Selected iOS test destination: platform=iOS Simulator,id=$IOS_SIM_UDID ($IOS_SIM_NAME)"

          # Record the exact runtime and toolchain. The selector above takes the
          # NEWEST iOS 26.x runtime the runner happens to expose, so a runner
          # image refresh can move the test suite onto a different runtime with
          # no commit in this repo. Without these two lines a failure cannot be
          # attributed to a runtime change after the fact.
          echo "Selected simulator runtime:"
          xcrun simctl list devices available -j |
            jq -r --arg udid "$IOS_SIM_UDID" '
              .devices
              | to_entries[]
              | select(any(.value[]?; .udid == $udid))
              | .key
            '
          xcodebuild -version

      - name: Resolve package dependencies
        if: steps.scope.outputs.docs_only != 'true'
        run: |
          xcodebuild -resolvePackageDependencies \
            -project Echo.xcodeproj \
            -scheme Echo \
            -onlyUsePackageVersionsFromResolvedFile

      # ── BUILD GATE ──────────────────────────────────────────────────────────
      # Compile every shipping target AND the test target. This is the gate for
      # non-compiling commits — e.g. the @frozen-on-an-internal-struct error and
      # the missing `import Foundation` in a test file, both of which merged
      # uncaught (CODE_AUDIT.md §10 rec. 5; §5.1). `build-for-testing` compiles
      # app + widget + embedded watch app + EchoTests without booting a simulator,
      # so it fails fast and clearly on compile errors.
      - name: Build for testing — Echo (iOS app + widget + watch + tests)
        if: steps.scope.outputs.docs_only != 'true'
        run: |
          set -o pipefail
          xcodebuild build-for-testing \
            -project Echo.xcodeproj \
            -scheme Echo \
            -destination "${{ steps.ios-sim.outputs.destination }}" \
            -parallel-testing-enabled NO \
            -jobs 5 \
            CODE_SIGNING_ALLOWED=NO \
            -quiet

      # Deliberately NOT `-quiet`: this step only runs already-built tests, so it
      # emits test results rather than compiler output, and `-quiet` reduces a
      # failure to a bare test name with no assertion text and no crash trace.
      # That is how the PlayerModelAccentTests failure on b0f8a500 became
      # undiagnosable — a crashed test process and a failed assertion print
      # identically under `-quiet`. The result bundle preserves the crash logs.
      - name: Test — EchoTests
        if: steps.scope.outputs.docs_only != 'true'
        env:
          # Public fixture only. Keep a real import-to-ONNX proof alongside the
          # fast recording-engine tests; the local test remains opt-in.
          SIMCTL_CHILD_ECHO_EPUB_LISTENING_OUTPUT: ${{ runner.temp }}/epub-pronunciation-proof
        run: |
          set -o pipefail
          rm -rf TestResults.xcresult
          xcodebuild test-without-building \
            -project Echo.xcodeproj \
            -scheme Echo \
            -destination "${{ steps.ios-sim.outputs.destination }}" \
            -only-testing:EchoTests \
            -parallel-testing-enabled NO \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO

      - name: Upload EPUB pronunciation proof
        if: always() && steps.scope.outputs.docs_only != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: EPUBPronunciationProof-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/epub-pronunciation-proof
          retention-days: 14
          if-no-files-found: warn

      - name: Upload test result bundle
        if: failure() && steps.scope.outputs.docs_only != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: TestResults-${{ github.run_id }}-${{ github.run_attempt }}
          path: TestResults.xcresult
          retention-days: 14
          if-no-files-found: warn

      - name: Build — Echo macOS
        if: steps.scope.outputs.docs_only != 'true'
        run: |
          set -o pipefail
          xcodebuild build \
            -project Echo.xcodeproj \
            -scheme "Echo macOS" \
            -destination "platform=macOS" \
            CODE_SIGNING_ALLOWED=NO \
            -jobs 5 \
            -quiet

      - name: Build — echo-cli
        if: steps.scope.outputs.docs_only != 'true'
        run: |
          set -o pipefail
          xcodebuild build \
            -project Echo.xcodeproj \
            -scheme echo-cli \
            -destination "platform=macOS" \
            CODE_SIGNING_ALLOWED=NO \
            -jobs 5 \
            -quiet
